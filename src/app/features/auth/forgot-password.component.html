<div class="auth-shell">
  <p-toast></p-toast>
  <div class="auth-card-container">
    <p-card [header]="step === 'EMAIL' ? 'Quên mật khẩu' : 'Đặt lại mật khẩu'" subheader="Trung tâm Lọc máu LocMau">
      <p-messages [(value)]="messages" [enableService]="false" [closable]="true"></p-messages>

      <!-- Step 1: Send OTP -->
      <form *ngIf="step === 'EMAIL'" [formGroup]="emailForm" (ngSubmit)="sendOtp()">
        <p class="text-sm text-600 mb-3">
          Nhập địa chỉ email tài khoản cán bộ y tế của bạn. Hệ thống sẽ gửi mã OTP xác thực để cấp lại quyền truy cập.
        </p>

        <div class="field mb-3">
          <label for="email" class="font-medium">Địa chỉ Email</label>
          <div class="p-input-icon-left w-full">
            <i class="pi pi-envelope"></i>
            <input id="email" type="email" pInputText formControlName="email" class="w-full" placeholder="bacsi@dialysis.local" />
          </div>
          <small class="p-error" *ngIf="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
            Email không hợp lệ
          </small>
        </div>

        <button
          pButton
          type="submit"
          label="Gửi mã OTP qua Email"
          icon="pi pi-send"
          class="w-full btn-primary"
          [loading]="loading"
          [disabled]="loading || emailForm.invalid"
        ></button>
      </form>

      <!-- Step 2: Enter OTP & New Password -->
      <form *ngIf="step === 'OTP_RESET'" [formGroup]="resetForm" (ngSubmit)="resetPassword()">
        <div class="simulated-otp-box p-2 mb-3 surface-100 border-round text-center" *ngIf="simulatedOtp">
          <span class="text-xs text-500">Mã OTP thử nghiệm (Dev simulation):</span>
          <div class="font-bold text-xl text-primary">{{ simulatedOtp }}</div>
        </div>

        <div class="field mb-3">
          <label for="otp" class="font-medium">Mã OTP (6 chữ số)</label>
          <input id="otp" type="text" pInputText formControlName="otp" class="w-full" placeholder="Nhập mã OTP" maxlength="6" />
        </div>

        <div class="field mb-3">
          <label for="password" class="font-medium">Mật khẩu mới</label>
          <p-password formControlName="password" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)"></p-password>
        </div>

        <div class="field mb-3">
          <label for="confirmPassword" class="font-medium">Xác nhận mật khẩu mới</label>
          <p-password formControlName="confirmPassword" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" placeholder="Nhập lại mật khẩu mới"></p-password>
        </div>

        <button
          pButton
          type="submit"
          label="Xác nhận & Đặt lại mật khẩu"
          icon="pi pi-check"
          class="w-full p-button-success"
          [loading]="loading"
          [disabled]="loading || resetForm.invalid"
        ></button>
      </form>

      <div class="mt-4 text-center">
        <a routerLink="/auth/login" class="text-sm text-primary font-medium hover:underline">
          <i class="pi pi-arrow-left mr-1"></i> Quay lại trang Đăng nhập
        </a>
      </div>
    </p-card>
  </div>
</div>
